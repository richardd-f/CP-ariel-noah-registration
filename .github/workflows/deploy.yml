name: Deploy Laravel to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registration-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, build, and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Validate SSH secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_FINGERPRINT: ${{ secrets.SSH_FINGERPRINT }}
        run: |
          : "${SSH_HOST:?Set the SSH_HOST repository secret}"
          : "${SSH_USERNAME:?Set the SSH_USERNAME repository secret}"
          : "${SSH_FINGERPRINT:?Set the SSH_FINGERPRINT repository secret}"
          if [ -z "$SSH_KEY" ] && [ -z "$SSH_PASSWORD" ]; then
            echo "Set SSH_KEY or SSH_PASSWORD as a repository secret." >&2
            exit 1
          fi

      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          extensions: gd, mbstring, pdo_sqlite, sqlite3, xml, ctype, iconv, bcmath, filter, zip
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Prepare the test environment
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate --no-interaction

      - name: Build production assets
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run build

      - name: Run tests
        run: |
          php artisan test --compact

      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 20m
          envs: DEPLOY_SHA
          script: |
            bash -se <<'DEPLOY'
            set -euo pipefail
            deploy_dir=/home/lunchcart-ticket/htdocs/ticket.lunchcart.my.id
            cd "$deploy_dir"

            for deploy_tool in git php composer node npm curl; do
              if ! command -v "$deploy_tool" >/dev/null; then
                echo "$deploy_tool is not available to the SSH user." >&2
                exit 1
              fi
            done
            test -f .env
            test -f artisan
            test -w storage
            test -w bootstrap/cache
            test "$(git branch --show-current)" = main
            git diff --quiet
            git diff --cached --quiet
            php -r 'if (PHP_VERSION_ID < 80400 || !extension_loaded("gd")) { fwrite(STDERR, "PHP 8.4+ with GD is required.\n"); exit(1); }'
            node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (!((major === 20 && minor >= 19) || (major === 22 && minor >= 12) || major > 22)) { throw new Error("Vite requires Node 20.19+ or 22.12+."); }'

            git fetch origin main
            git merge-base --is-ancestor HEAD "$DEPLOY_SHA"
            php artisan down --retry=60
            trap 'echo "Deployment failed; maintenance remains enabled. Check the Actions log before reopening the site." >&2' ERR
            git merge --ff-only "$DEPLOY_SHA"
            composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
            npm ci --include=dev --no-audit --no-fund
            npm run build
            php artisan config:clear --no-interaction
            php artisan route:clear --no-interaction
            php artisan view:clear --no-interaction
            php artisan migrate --force --no-interaction
            php artisan optimize --no-interaction
            php artisan up --no-interaction

            if ! curl --fail --silent --show-error --output /dev/null --retry 3 --retry-delay 3 --max-time 20 https://ticket.lunchcart.my.id/up; then
              php artisan down --retry=60
              echo "The health check failed; maintenance has been re-enabled." >&2
              exit 1
            fi
            DEPLOY
